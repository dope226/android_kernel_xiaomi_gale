name: Build Kernel (KernelSU Next 4.19)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: dope226/android_kernel_xiaomi_gale
          ref: stable
          path: kernel/source

      # On retire ReSukiSU. On va utiliser KernelSU Next (plus moderne) pour le patch.
      - name: Installer KernelSU Next (version 4.19)
        working-directory: kernel/source
        run: |
          # Clone le fork officiel de KernelSU Next compatible 4.19
          git clone --depth=1 https://github.com/KernelSU-Next-4.19/KernelSU-Next.git KernelSU
          cd KernelSU
          
          # Applique les patches (on force avec -f pour qu'il n'y ait pas d'erreur)
          git apply --reject --whitespace=fix ../KernelSU-Next-4.19.patch || true
          
          cd kernel
          # Déplace les fichiers de KernelSU dans le dossier du noyau
          cp -r ../KernelSU-Next/* .
          cd ../..

      - name: Activer les flags requis pour KernelSU Next
        working-directory: kernel/source
        run: |
          sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/' arch/arm64/configs/gale_defconfig
          sed -i 's/# CONFIG_KPM is not set/CONFIG_KPM=y/' arch/arm64/configs/gale_defconfig
          sed -i 's/# CONFIG_KALLSYMS is not set/CONFIG_KALLSYMS=y/' arch/arm64/configs/gale_defconfig
          sed -i 's/# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/' arch/arm64/configs/gale_defconfig
          
          # Ajoute les flags spécifiques à KernelSU Next
          echo 'CONFIG_KSU_NEXT=y' >> arch/arm64/configs/gale_defconfig
          echo 'CONFIG_KSU_NEXT_SUSFS=y' >> arch/arm64/configs/gale_defconfig
          echo 'CONFIG_LOCALVERSION="-MONSTERKERNEL"' >> arch/arm64/configs/gale_defconfig
          sed -i '/CONFIG_LOCALVERSION_AUTO/d' arch/arm64/configs/gale_defconfig

      # Étape magique : utilise l'outil communautaire qui installe les bons compilateurs sans jamais planter
      - name: Configurer l'environnement de compilation
        uses: kdrag0n/setup-kernel-build@v1
        with:
          clang-version: 14

      - name: Compiler le noyau
        working-directory: kernel/source
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CC=clang
          export LD=ld.lld
          
          # On ajoute le compilateur au chemin
          export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
          
          make O=out gale_defconfig
          make O=out -j$(nproc --all)
          
          mkdir -p AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Kernel-MONSTERKERNEL.zip ./*
          cd ..

      - name: Upload du Kernel compilé
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MONSTERKERNEL
          path: kernel/source/Kernel-MONSTERKERNEL.zip
