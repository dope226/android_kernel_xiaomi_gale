name: Build Kernel (KernelSU Next 4.19) - NDK toolchain
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      NDK_VERSION: android-ndk-r25b
      NDK_URL: https://dl.google.com/android/repository/android-ndk-r25b-linux.zip

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: dope226/android_kernel_xiaomi_gale
          ref: stable
          path: kernel/source

      - name: Install host build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev dwarves zip unzip \
            git wget ca-certificates gnupg curl
          # binutils for aarch64 host cross tools (optional fallback)
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu || true

      - name: Download and extract Android NDK (toolchain)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          echo "Downloading NDK ${NDK_VERSION}..."
          wget -qO ndk.zip "${NDK_URL}"
          unzip -q ndk.zip -d toolchain
          rm ndk.zip
          # Path to the NDK clang toolchain
          NDK_BIN="${GITHUB_WORKSPACE}/toolchain/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -d "$NDK_BIN" ]; then
            echo "NDK toolchain not found at $NDK_BIN"
            ls -la toolchain || true
            exit 1
          fi
          echo "$NDK_BIN" >> $GITHUB_PATH
          echo "NDK bin added to PATH: $NDK_BIN"
          # Optional: show clang version
          "${NDK_BIN}/clang" --version || true

      - name: Installer KernelSU Next (si disponible)
        working-directory: kernel/source
        run: |
          set -e
          if git ls-remote --exit-code https://github.com/KernelSU-Next-4.19/KernelSU-Next.git >/dev/null 2>&1; then
            git clone --depth=1 https://github.com/KernelSU-Next-4.19/KernelSU-Next.git KernelSU
            if [ -f ../KernelSU-Next-4.19.patch ]; then
              cd KernelSU
              git apply --reject --whitespace=fix ../KernelSU-Next-4.19.patch || true
              cd ..
            fi
            cp -r KernelSU/* . || true
          else
            echo "Dépôt KernelSU-Next-4.19 introuvable. Si vous avez un patch, placez-le dans kernel/source/."
            if [ -f KernelSU-Next-4.19.patch ]; then
              git apply --reject --whitespace=fix KernelSU-Next-4.19.patch || true
            fi
          fi

      - name: Activer les flags requis pour KernelSU Next
        working-directory: kernel/source
        run: |
          set -e
          DEFCONFIG=arch/arm64/configs/gale_defconfig
          if [ ! -f "$DEFCONFIG" ]; then
            echo "Fichier $DEFCONFIG introuvable. Vérifiez le chemin et le nom de la defconfig."
            exit 1
          fi
          sed -i 's/^# CONFIG_KSU is not set/CONFIG_KSU=y/' "$DEFCONFIG" || true
          sed -i 's/^# CONFIG_KPM is not set/CONFIG_KPM=y/' "$DEFCONFIG" || true
          sed -i 's/^# CONFIG_KALLSYMS is not set/CONFIG_KALLSYMS=y/' "$DEFCONFIG" || true
          sed -i 's/^# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/' "$DEFCONFIG" || true
          grep -q '^CONFIG_KSU_NEXT=y' "$DEFCONFIG" || echo 'CONFIG_KSU_NEXT=y' >> "$DEFCONFIG"
          grep -q '^CONFIG_KSU_NEXT_SUSFS=y' "$DEFCONFIG" || echo 'CONFIG_KSU_NEXT_SUSFS=y' >> "$DEFCONFIG"
          sed -i '/^CONFIG_LOCALVERSION=/d' "$DEFCONFIG" || true
          echo 'CONFIG_LOCALVERSION="-MONSTERKERNEL"' >> "$DEFCONFIG"
          sed -i '/CONFIG_LOCALVERSION_AUTO/d' "$DEFCONFIG" || true

      - name: Configure environment variables for NDK build
        working-directory: kernel/source
        run: |
          set -e
          # Use Android NDK clang toolchain
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-android-" >> $GITHUB_ENV
          # Use clang from NDK (clang driver will pick API level suffix automatically)
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "HOSTCC=gcc" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          # Recommended API level for kernel modules; ajuste si besoin
          echo "ANDROID_API_LEVEL=21" >> $GITHUB_ENV

      - name: Compile kernel with NDK toolchain (capture logs)
        working-directory: kernel/source
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=${CROSS_COMPILE:-aarch64-linux-android-}
          export CLANG_TRIPLE=${CLANG_TRIPLE:-aarch64-linux-android-}
          export CC=${CC:-clang}
          export LD=${LD:-ld.lld}
          export HOSTCC=${HOSTCC:-gcc}
          export LLVM=1
          export ANDROID_API_LEVEL=${ANDROID_API_LEVEL:-21}

          # Ensure NDK clang driver with API suffix is available (example: aarch64-linux-android21-clang)
          # The kernel build system will call clang via CC; CLANG_TRIPLE helps locate llvm tools.
          echo "Using CC: $(command -v $CC || true)"
          echo "Using clang driver examples:"
          ls -1 $(dirname $(command -v $CC))/aarch64-linux-android* || true

          # Generate defconfig
          make O=out gale_defconfig 2>&1 | tee defconfig.log

          # Build: pass CLANG_TRIPLE and LLVM=1; CROSS_COMPILE aarch64-linux-android- will be used for objcopy/ar names
          make O=out CC="$CC" LD="$LD" LLVM=1 CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" -j$(nproc) 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > build_rc

          # If kernel image exists, package AnyKernel3
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            mkdir -p AnyKernel3
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || true
            cd AnyKernel3
            zip -r9 ../Kernel-MONSTERKERNEL.zip ./* || true
            cd ..
          fi

          echo "Compilation finished with exit code: $rc"
          # keep step success to upload logs; final step will fail job if rc != 0
          exit 0

      - name: Upload build logs (toujours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-logs
          path: |
            kernel/source/build.log
            kernel/source/defconfig.log
            kernel/source/build_rc

      - name: Upload kernel zip if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MONSTERKERNEL
          path: kernel/source/Kernel-MONSTERKERNEL.zip

      - name: Fail job if compilation a échoué
        working-directory: kernel/source
        run: |
          set -e
          if [ -f build_rc ]; then
            rc=$(cat build_rc)
            if [ "$rc" -ne 0 ]; then
              echo "La compilation a échoué avec le code $rc. Voir kernel-build-logs pour le détail."
              exit "$rc"
            else
              echo "Compilation réussie."
            fi
          else
            echo "build_rc introuvable. Impossible de déterminer le statut de compilation."
            exit 1
