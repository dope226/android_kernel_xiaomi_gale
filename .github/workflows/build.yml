name: Build gale + ReSukiSU
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: dope226/android_kernel_xiaomi_gale
          ref: stable
          path: kernel/source

      - name: Intégrer ReSukiSU (main = dernière version)
        working-directory: kernel/source
        run: curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Intégrer SUSFS
        working-directory: kernel/source
        run: |
          git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch .
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          patch -p1 < 50_add_susfs_in_kernel-4.19.patch
          cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch && cd ..
          find KernelSU -type f -name "*.c" -exec sed -i 's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' {} +

      - name: Activer les flags requis
        working-directory: kernel/source
        run: |
          ./scripts/config --file arch/arm64/configs/gale_defconfig \
            -e KSU -e KPM -e KALLSYMS -e KALLSYMS_ALL -e KSU_SUSFS \
            --set-str LOCALVERSION "-MONSTERKERNEL" -d LOCALVERSION_AUTO


      - name: Build + package AnyKernel3
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: ./kernel/source/
          config: gale_defconfig
          arch: arm64
          aosp-clang: true
          aosp-gcc: true
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
