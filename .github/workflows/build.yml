name: Build gale + ReSukiSU (Compilation stable)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: dope226/android_kernel_xiaomi_gale
          ref: stable
          path: kernel/source

      - name: Intégrer ReSukiSU (main = dernière version)
        working-directory: kernel/source
        run: curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Intégrer SUSFS
        working-directory: kernel/source
        run: |
          git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch .
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          
          patch -F 3 -f -p1 < 50_add_susfs_in_kernel-4.19.patch || true
          cd KernelSU && patch -F 3 -f -p1 < 10_enable_susfs_for_ksu.patch || true && cd ..
          
          find . -name "*.rej" -type f -delete
          find KernelSU -type f -name "*.c" -exec sed -i 's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' {} +

      - name: Activer les flags requis
        working-directory: kernel/source
        run: |
          sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/' arch/arm64/configs/gale_defconfig
          sed -i 's/# CONFIG_KPM is not set/CONFIG_KPM=y/' arch/arm64/configs/gale_defconfig
          sed -i 's/# CONFIG_KALLSYMS is not set/CONFIG_KALLSYMS=y/' arch/arm64/configs/gale_defconfig
          sed -i 's/# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/' arch/arm64/configs/gale_defconfig
          sed -i 's/# CONFIG_KSU_SUSFS is not set/CONFIG_KSU_SUSFS=y/' arch/arm64/configs/gale_defconfig
          echo 'CONFIG_LOCALVERSION="-MONSTERKERNEL"' >> arch/arm64/configs/gale_defconfig
          sed -i '/CONFIG_LOCALVERSION_AUTO/d' arch/arm64/configs/gale_defconfig

      - name: Télécharger et configurer la chaîne de compilation (Clang + GCC)
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex bison build-essential zip rsync
          
          # 1. Téléchargement de AOSP Clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r522817.tar.gz
          mkdir -p clang
          tar -xzf clang-r522817.tar.gz -C clang/
          
          # 2. Téléchargement du GCC pour ARM64 (INDISPENSABLE pour votre noyau 4.19)
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android-12.1.0_r0 --depth=1
          
          # Ajout des deux dossiers binaires au PATH
          echo "${{ github.workspace }}/clang/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/aarch64-linux-android-4.9/bin" >> $GITHUB_PATH

      - name: Compiler le noyau et créer le package AnyKernel3
        working-directory: kernel/source
        run: |
          # Export des variables
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export LLVM=1 # Indique d'utiliser CLANG comme compilateur principal
          
          # Compilation
          make O=out gale_defconfig
          make O=out -j$(nproc --all)
          
          # Préparation du package
          mkdir -p AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          
          cd AnyKernel3
          zip -r9 ../Kernel-MONSTERKERNEL.zip ./*
          cd ..

      - name: Upload du Kernel compilé en Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MONSTERKERNEL
          path: kernel/source/Kernel-MONSTERKERNEL.zip
